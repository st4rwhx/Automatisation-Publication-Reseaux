name: Détecter les articles, publier et mettre à jour le flux RSS

on:
  schedule:
    - cron: "0 */2 * * *" # toutes les 2 heures
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Remontés en env car le contexte `secrets` n'est pas lisible dans un `if:` de step.
    env:
      POSTIZ_API_URL: ${{ secrets.POSTIZ_API_URL }}
      POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Détecter les nouveaux articles et régénérer rss.xml
        run: node scripts/generate-rss.mjs

      # Ne s'exécute que si les secrets POSTIZ_API_URL et POSTIZ_API_KEY sont
      # configurés (Settings → Secrets and variables → Actions). Tant qu'ils sont
      # absents, le workflow se contente de tenir le flux RSS à jour.
      - name: Publier les nouveaux articles sur les réseaux
        if: env.POSTIZ_API_KEY != ''
        run: node scripts/publish-to-postiz.mjs

      - name: Committer l'état
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ public/rss.xml
          git diff --staged --quiet || git commit -m "chore: état de publication et flux RSS"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
