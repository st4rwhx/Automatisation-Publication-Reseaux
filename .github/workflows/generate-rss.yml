name: Détecter les articles, publier et mettre à jour le flux RSS

on:
  schedule:
    - cron: "0 */2 * * *" # toutes les 2 heures
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1. Détecte les nouveaux articles, régénère le flux et les visuels.
  build:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Nécessaire au montage vidéo (assemble-video.mjs). Présent par défaut sur
      # ubuntu-latest, mais on le force pour ne pas dépendre de l'image du runner.
      - name: Installer ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Détecter les nouveaux articles et régénérer rss.xml
        run: node scripts/generate-rss.mjs

      # Le post du jour. Idempotent : une seule génération par date, quel que soit
      # le nombre d'exécutions du workflow dans la journée.
      - name: Écrire le post du jour
        if: env.GEMINI_API_KEY != '' || env.GROQ_API_KEY != '' || env.OPENROUTER_API_KEY != '' || env.KIMI_API_KEY != ''
        run: node scripts/generate-daily-post.mjs

      # Instagram et TikTok refusent un post sans média : sans ces visuels,
      # la publication sur ces deux réseaux échoue.
      - name: Générer les visuels manquants
        run: node scripts/generate-images.mjs

      # Vidéo verticale du post du jour : script (LLM) → voix off (TTS gratuit) →
      # b-roll (Pexels) → montage (ffmpeg). Ignoré si PEXELS_API_KEY absente —
      # le système retombe sur le visuel statique pour ce jour-là.
      - name: Générer la vidéo du jour
        if: |
          env.PEXELS_API_KEY != '' &&
          (env.GEMINI_API_KEY != '' || env.GROQ_API_KEY != '' || env.OPENROUTER_API_KEY != '' || env.KIMI_API_KEY != '')
        run: npm run video
        continue-on-error: true

      - name: Committer le flux, les visuels et la vidéo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ public/
          git diff --staged --quiet || git commit -m "chore: flux RSS, visuels et vidéo du jour"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # 2. Met les visuels en ligne. Indispensable avant de publier : Postiz vient
  #    chercher les images à leur URL publique, elles doivent donc déjà y être.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 3. Publie sur les réseaux, une fois les visuels réellement accessibles.
  #    Ne fait rien tant que les secrets Postiz ne sont pas configurés.
  publish:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      POSTIZ_API_URL: ${{ secrets.POSTIZ_API_URL }}
      POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
      IMAGES_BASE_URL: ${{ needs.deploy.outputs.page_url || vars.IMAGES_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Publier les nouveaux articles sur les réseaux
        if: env.POSTIZ_API_KEY != ''
        run: node scripts/publish-to-postiz.mjs

      - name: Committer l'état de publication
        if: always() && env.POSTIZ_API_KEY != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }}
          git add data/published.json
          git diff --staged --quiet || git commit -m "chore: état de publication réseaux"
          git push
